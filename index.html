<title>FormulaPath</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#d5dcea;--accent:#1d4ed8;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1729;--card:#1a2540;--ink:#eef2ff;--mute:#9aa7c7;--line:#2e3b5e;--accent:#7aa2ff;--ok:#4ade80;--okbg:#12361f;--bad:#f87171;--badbg:#401818;--onacc:#0f1729}}
:root[data-theme="dark"]{--bg:#0f1729;--card:#1a2540;--ink:#eef2ff;--mute:#9aa7c7;--line:#2e3b5e;--accent:#7aa2ff;--ok:#4ade80;--okbg:#12361f;--bad:#f87171;--badbg:#401818;--onacc:#0f1729}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;font:600 15px system-ui,sans-serif;color:var(--mute);margin-bottom:12px}
.top b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.q{font:600 16px system-ui,sans-serif;color:var(--mute);margin:0 0 10px}
.f{font-size:28px;line-height:1.35;overflow-wrap:anywhere;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{font:500 17px system-ui,sans-serif;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.opt:focus-visible,.next:focus-visible,.lg:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.info{margin-top:14px;padding:12px 14px;border-left:4px solid var(--accent);font:15px/1.5 system-ui,sans-serif;display:none;overflow-wrap:anywhere}
.next{margin-top:14px;width:100%;padding:14px;font:600 17px system-ui,sans-serif;border:0;border-radius:10px;background:var(--accent);color:var(--onacc);cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}.ch{padding:10px 14px;font:600 15px system-ui,sans-serif;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}.ch.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}.ch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.mu{flex:0 0 54px!important}
.langs{display:flex;gap:8px;margin-bottom:14px}
.lg{flex:1;padding:10px 4px;font:600 15px system-ui,sans-serif;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.lg.on{border-color:var(--accent);background:var(--accent);color:var(--onacc)}
input{width:100%;padding:14px;font:17px system-ui,sans-serif;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
h1{font-size:30px;margin:6px 0 14px}
.foot{max-width:560px;margin:0 auto;padding:8px 16px 24px;text-align:center;font:13px/1.5 system-ui,sans-serif;color:var(--mute)}
.big{font-size:56px;margin:8px 0}
.c{text-align:center}
</style>
</head>

var app=document.getElementById("app");
function t(k){return T[C[L]][k]}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fm(s){return s.replace("{n}",esc(name))}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function langBar(){return '<div class="langs">'+LN.map(function(n,i){return '<button class="lg'+(i==L?' on':'')+'" data-i="'+i+'">'+n+'</button>'}).join("")+'<button class="lg mu" id="mu" aria-label="sound">'+(mute?"🔇":"🔊")+'</button></div>'}
function bindLang(f){app.querySelectorAll(".lg[data-i]").forEach(function(b){b.onclick=function(){L=+b.dataset.i;put("fy-lang",L);f()}});var m=document.getElementById("mu");if(m)m.onclick=function(){mute=!mute;put("fy-mute",mute?1:0);m.textContent=mute?"🔇":"🔊"}}
function home(){
app.innerHTML=langBar()+'<div class="card c"><h1>'+t("title")+'</h1><p class="q">'+t("ask")+'</p><input id="nm" maxlength="20" autocomplete="off" placeholder="'+t("ph")+'" value="'+esc(name)+'"><button class="next" id="go">'+t("go")+'</button></div>';
bindLang(function(){name=document.getElementById("nm").value;home()});
var go=function(){var v=document.getElementById("nm").value.trim();if(!v){document.getElementById("nm").focus();return}name=v;put("fy-name",v);levels()};
document.getElementById("go").onclick=go;
document.getElementById("nm").onkeydown=function(e){if(e.key==="Enter")go()}
}
var M={sub:0,tst:0,md:0,lv:0},mute=false,ac=null,POOL=D,RT=[0,100,300,700,1500,3000];
function rk(x){var r=0;RT.forEach(function(v,i){if(x>=v)r=i});return r}
function snd(k){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var q={ok:[[660,0],[880,.09]],no:[[180,0],[140,.12]],end:[[523,0],[659,.12],[784,.24]],up:[[523,0],[659,.1],[784,.2],[1047,.3]]}[k];q.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+n[1];o.type=k=="no"?"sawtooth":"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+.18);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.2)})}catch(e){}}
function chips(k,a){return '<div class="chips">'+a.map(function(n,i){return '<button class="ch'+(M[k]==i?' on':'')+'" data-k="'+k+'" data-i="'+i+'">'+n+'</button>'}).join("")+'</div>'}
function levels(){
var xp=+get("fy-xp")||0,r=rk(xp),nx=RT[r+1];
app.innerHTML=langBar()+'<div class="card c"><h1>'+fm(t("hi"))+'</h1><p class="q">★ '+t("ranks")[r]+' · '+xp+(nx!=null?' / '+nx:'')+' XP</p><p class="q">'+t("sub")+'</p>'+chips("sub",t("subs"))+'<p class="q">'+t("tst")+'</p>'+chips("tst",t("tsts"))+'<p class="q">'+t("md")+'</p>'+chips("md",t("mds"))+'<p class="q">'+t("lvl")+'</p>'+chips("lv",t("lvs"))+'<button class="next" id="go">'+t("go")+'</button></div>';
bindLang(levels);
app.querySelectorAll(".ch").forEach(function(b){b.onclick=function(){M[b.dataset.k]=+b.dataset.i;put("fy-m",JSON.stringify(M));levels()}});
document.getElementById("go").onclick=start
}
function start(){
POOL=M.sub?D2:D;
var a=POOL.filter(function(x){return x[0]===M.lv}),b=POOL.filter(function(x){return x[0]<=M.lv});
S={i:0,score:0,lives:3,streak:0,n:0,t:60,end:0,base:M.md==0?a:b};
S.deck=sh(S.base);
if(M.md==2){S.lives=99;S.timer=setInterval(tick,1000)}
ask()
}
function tick(){S.t--;var e=document.getElementById("tm"),bb=document.getElementById("bb");if(e)e.textContent=S.t;if(bb)bb.style.width=(S.t/60*100)+"%";if(S.t<=0)finish()}
function nextQ(){S.i++;if(S.i>=S.deck.length){if(M.md==0)return finish();S.deck=sh(S.base);S.i=0}ask()}
function others(x){return sh(POOL.filter(function(y){return y!==x})).slice(0,3)}
function ask(){
var x=S.deck[S.i],ty=["c","u","n"];if(x[4]>=0)ty.push("w");
var k=ty[Math.floor(Math.random()*ty.length)],q,f,right,wr;
if(M.tst==1){q=t("q2");f=x[5][L];right=x[1]+" "+x[2];wr=x[3].map(function(w){return x[1]+" "+w})}
else if(k=="c"){q=t("qc")+": "+x[5][L];f=x[1]+" ?";right=x[2];wr=x[3]}
else{f=x[1]+" "+x[2];
if(k=="u"){q=t("qu");right=x[6][L];wr=others(x).map(function(y){return y[6][L]})}
else if(k=="n"){q=t("qn");right=x[5][L];wr=others(x).map(function(y){return y[5][L]})}
else{q=t("qw");right=NM[x[4]][L];wr=sh(NM.filter(function(_,i){return i!=x[4]})).slice(0,3).map(function(n){return n[L]})}}
var l=M.md==0?t("q")+' <b>'+(S.i+1)+'/'+S.deck.length+'</b>':M.md==1?t("q")+' <b>'+(S.n+1)+'</b>':'⏱ <b id="tm">'+S.t+'</b>';
var r=M.md==2?'🔥 <b>'+S.streak+'</b>':t("life")+' <b>'+"♥".repeat(S.lives)+'</b>';
var w=M.md==0?S.i/S.deck.length*100:M.md==1?Math.min(S.streak,10)*10:S.t/60*100;
app.innerHTML='<div class="top"><span>'+l+'</span><span>'+t("p")+' <b>'+S.score+'</b></span><span>'+r+'</span></div><div class="bar"><i id="bb" style="width:'+w+'%"></i></div><div class="card"><p class="q">'+q+'</p><p class="f">'+f+'</p><div class="opts" id="o"></div><div class="info" id="info"></div><button class="next" id="nx" style="display:none"></button></div>';
var o=document.getElementById("o");
sh([right].concat(wr)).forEach(function(v){var b=document.createElement("button");b.className="opt";b.textContent=v;b.onclick=function(){pick(b,v===right,right,x)};o.appendChild(b)})
}
function pick(b,ok,right,x){
var s=S;
document.querySelectorAll(".opt").forEach(function(e){e.disabled=true;if(e.textContent===right)e.classList.add("ok")});
S.n++;
if(ok){S.streak++;S.score+=10+Math.min(S.streak-1,5)*2;snd("ok")}else{b.classList.add("bad");S.streak=0;if(M.md!=2)S.lives--;snd("no")}
if(M.md==2){setTimeout(function(){if(s===S&&!S.end)nextQ()},ok?450:900);return}
var info=document.getElementById("info");info.style.display="block";
info.innerHTML="<b>"+fm(ok?t("ok"):t("no"))+"</b><br>"+x[5][L]+"<br>"+esc(x[1]+" "+x[2])+"<br>"+(x[4]>=0?t("who")+NM[x[4]][L]+"<br>":"")+x[6][L];
var last=S.lives<=0||(M.md==0&&S.i>=S.deck.length-1),nx=document.getElementById("nx");
nx.style.display="block";nx.textContent=last?t("fin"):t("nx");
nx.onclick=function(){if(last)finish();else nextQ()};nx.focus()
}
function finish(){
if(S.end)return;S.end=1;if(S.timer)clearInterval(S.timer);
var key="fy-best-"+M.sub+M.tst+M.md+M.lv,b=+get(key)||0,nb=S.score>b;if(nb)put(key,S.score);
var x0=+get("fy-xp")||0,x1=x0+S.score;put("fy-xp",x1);
var r1=rk(x1),up=r1>rk(x0);snd(up?"up":"end");
app.innerHTML='<div class="card c"><h1>'+fm(S.lives>0?t("done"):t("over"))+'</h1><div class="big">'+S.score+'</div><p>'+(nb?t("rec"):t("best")+": "+b)+'</p><p>+'+S.score+' XP · ★ '+t("ranks")[r1]+'</p>'+(up?'<p><b>'+t("up")+t("ranks")[r1]+'</b></p>':'')+'<button class="next" id="again">'+t("again")+'</button><button class="next" id="menu" style="background:var(--card);color:var(--ink);border:1.5px solid var(--line)">'+t("menu")+'</button></div>';
document.getElementById("again").onclick=start;
document.getElementById("menu").onclick=levels
}
try{M=Object.assign(M,JSON.parse(get("fy-m")))}catch(e){}
L=+get("fy-lang")||0;name=get("fy-name")||"";mute=get("fy-mute")=="1";home();
</script>
</body>
